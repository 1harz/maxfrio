<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" fill="none">
  <defs>
    <linearGradient id="cbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".6" stop-color="#EFF8FD"/>
      <stop offset="1" stop-color="#CFE7F5"/>
    </linearGradient>
    <radialGradient id="cvent" cx=".5" cy=".42" r=".65">
      <stop offset="0" stop-color="#12324E"/>
      <stop offset=".72" stop-color="#1B4266"/>
      <stop offset="1" stop-color="#2A5B85"/>
    </radialGradient>
    <radialGradient id="cglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7FE3FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7FE3FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0C1826" flood-opacity=".3"/>
    </filter>
  </defs>

  <g filter="url(#cshadow)">
    <!-- painel quadrado -->
    <rect x="70" y="70" width="660" height="660" rx="46" fill="url(#cbody)" stroke="#A5CCE1" stroke-width="3"/>
    <!-- cantos com fixes -->
    <g fill="#E2F1FA" stroke="#B7D8EA" stroke-width="2.5">
      <rect x="118" y="118" width="86" height="86" rx="20"/>
      <rect x="596" y="118" width="86" height="86" rx="20"/>
      <rect x="118" y="596" width="86" height="86" rx="20"/>
      <rect x="596" y="596" width="86" height="86" rx="20"/>
    </g>
    <g stroke="#8FB8D2" stroke-width="3" stroke-linecap="round" opacity=".8">
      <path d="M147 190v-18M129 172h36"/>
      <path d="M653 190v-18M635 172h36"/>
      <path d="M147 634v-18M129 616h36"/>
      <path d="M653 634v-18M635 616h36"/>
    </g>

    <!-- vanes diagonais -->
    <g stroke="#C3E0F0" stroke-width="4" stroke-linecap="round" opacity=".85">
      <path d="M240 240 L400 400"/>
      <path d="M560 240 L400 400"/>
      <path d="M240 560 L400 400"/>
      <path d="M560 560 L400 400"/>
    </g>

    <!-- vent central circular -->
    <circle cx="400" cy="400" r="150" fill="url(#cvent)" stroke="#8FB8D2" stroke-width="3"/>
    <circle cx="400" cy="400" r="150" fill="url(#cglow)"/>
    <circle cx="400" cy="400" r="108" fill="none" stroke="#4FA8DC" stroke-width="2.5" opacity=".65"/>
    <g stroke="#79B9DC" stroke-width="6" stroke-linecap="round" opacity=".55">
      <path d="M400 300v-22M400 522v-22M300 400h-22M522 400h-22"/>
    </g>
    <!-- hélice interna -->
    <g stroke="#7FCBEF" stroke-width="8" stroke-linecap="round" opacity=".8">
      <path d="M400 400 L400 328"/>
      <path d="M400 400 L462 436"/>
      <path d="M400 400 L338 436"/>
    </g>
    <circle cx="400" cy="400" r="16" fill="#A8DDF9"/>

    <!-- aro exterior -->
    <circle cx="400" cy="400" r="176" fill="none" stroke="#D8ECF7" stroke-width="8"/>
  </g>
  <ellipse cx="400" cy="764" rx="250" ry="20" fill="#0C1826" opacity=".12"/>
</svg>
