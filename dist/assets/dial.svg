<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="dring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8DDF9" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4FA8DC" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="dcore" cx=".5" cy=".42" r=".7">
      <stop offset="0" stop-color="#16304F"/>
      <stop offset="1" stop-color="#0C1826"/>
    </radialGradient>
    <radialGradient id="dglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7FE3FF" stop-opacity=".28"/>
      <stop offset=".7" stop-color="#7FE3FF" stop-opacity=".06"/>
      <stop offset="1" stop-color="#7FE3FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="200" cy="200" r="196" fill="url(#dglow)"/>

  <!-- ticks radiais via dasharray -->
  <circle class="dial-ticks" cx="200" cy="200" r="176" stroke="url(#dring)" stroke-width="14"
          stroke-dasharray="2 20.418" fill="none" opacity=".9"/>
  <circle class="dial-ticks-major" cx="200" cy="200" r="172" stroke="#A8DDF9" stroke-width="26"
          stroke-dasharray="3 87.154" fill="none" opacity=".95"/>

  <circle cx="200" cy="200" r="148" stroke="#4FA8DC" stroke-opacity=".4" stroke-width="2" fill="none"/>

  <!-- núcleo -->
  <circle class="dial-core" cx="200" cy="200" r="126" fill="url(#dcore)" stroke="#4FA8DC" stroke-opacity=".5" stroke-width="2"/>
  <!-- graus -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="84" font-weight="700" fill="#A8DDF9" letter-spacing="-2">
    <text class="dial-num" x="200" y="232" text-anchor="middle">22</text>
  </g>
  <text x="200" y="272" text-anchor="middle" font-family="Arial" font-size="22" letter-spacing="6" fill="#5B8AA9">°C FRIO</text>

  <!-- ponteiro -->
  <g class="dial-needle">
    <circle cx="200" cy="200" r="148" fill="none"/>
    <circle cx="200" cy="58" r="7" fill="#7FE3FF"/>
    <path d="M200 44 L200 72" stroke="#7FE3FF" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- arco ativo -->
  <path class="dial-arc" pathLength="1" d="M200 52 A148 148 0 0 1 324.998 103.547" stroke="#7FE3FF" stroke-width="4" stroke-linecap="round" opacity=".95"/>
</svg>
