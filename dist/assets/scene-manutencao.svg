<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="mw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FAFE"/>
      <stop offset="1" stop-color="#DCEEF9"/>
    </linearGradient>
    <filter id="mg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#16304F" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#mw)"/>
  <path d="M0 486 H800 V600 H0 Z" fill="#CFE6F3"/>
  <path d="M0 486 H800" stroke="#9CC4DC" stroke-width="3"/>

  <!-- unidade aberta em serviço -->
  <g filter="url(#mg)">
    <rect x="120" y="150" width="330" height="110" rx="20" fill="#FFFFFF" stroke="#8FB8D2" stroke-width="2.5"/>
    <!-- tampa aberta -->
    <path d="M120 170 Q120 150 140 150 L400 150" stroke="#8FB8D2" stroke-width="2.5" fill="none"/>
    <!-- interior: serpentina -->
    <g stroke="#7FB0CE" stroke-width="5" stroke-linecap="round">
      <path d="M150 210 h250 M150 232 h250"/>
    </g>
    <g stroke="#9CC4DC" stroke-width="4">
      <path d="M170 196 v48 M210 196 v48 M250 196 v48 M290 196 v48 M330 196 v48 M370 196 v48"/>
    </g>
    <circle cx="285" cy="352" r="46" fill="#F2FAFE" stroke="#7FB0CE" stroke-width="4"/>
    <path d="M285 352 L285 316 M285 352 L314 370 M285 352 L256 370" stroke="#4FA8DC" stroke-width="5" stroke-linecap="round"/>
    <circle cx="285" cy="352" r="6" fill="#16304F"/>
  </g>

  <!-- manômetros -->
  <g transform="translate(520,168)">
    <circle cx="0" cy="0" r="40" fill="#FFFFFF" stroke="#16304F" stroke-width="5"/>
    <path d="M0 0 L-18 -26" stroke="#E23D3D" stroke-width="4" stroke-linecap="round"/>
    <path d="M-26 10 a28 28 0 0 1 8 -22" stroke="#4FA8DC" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#16304F"/>
    <circle cx="86" cy="0" r="40" fill="#FFFFFF" stroke="#16304F" stroke-width="5"/>
    <path d="M86 0 L104 -22" stroke="#E23D3D" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 10 a28 28 0 0 1 8 -22" stroke="#4FA8DC" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="86" cy="0" r="5" fill="#16304F"/>
    <path d="M40 0 h6 M0 40 v30 M86 40 v30" stroke="#16304F" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 70 Q0 110 -60 130 M86 70 Q86 110 150 140" stroke="#16304F" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M-60 130 Q-100 150 -80 200" stroke="#4FA8DC" stroke-width="4" fill="none"/>
  </g>

  <!-- técnico agachado -->
  <g>
    <path d="M600 486 Q590 440 630 430 L700 436 Q730 452 726 486 Z" fill="#2A5B85"/>
    <path d="M640 430 L668 430 L672 470 L636 470 Z" fill="#2A5B85"/>
    <circle cx="646" cy="398" r="24" fill="#E8C9A8"/>
    <path d="M622 394 a24 24 0 0 1 48 0 v-8 a24 18 0 0 0 -48 0 Z" fill="#16304F"/>
    <path d="M664 440 L704 424" stroke="#2A5B85" stroke-width="15" stroke-linecap="round"/>
    <path d="M616 452 h44" stroke="#7FE3FF" stroke-width="7" stroke-dasharray="10 8"/>
    <!-- chave na mão -->
    <g transform="rotate(24 704 424)">
      <rect x="702" y="414" width="34" height="11" rx="4" fill="#16304F"/>
    </g>
  </g>

  <!-- prancheta checklist -->
  <g transform="translate(96,420)">
    <rect x="0" y="0" width="90" height="64" rx="8" fill="#FFFFFF" stroke="#16304F" stroke-width="4"/>
    <path d="M34 -6 h22 v12 h-22 z" fill="#4FA8DC"/>
    <g stroke="#7FB0CE" stroke-width="4" stroke-linecap="round">
      <path d="M14 22 h46 M14 36 h46 M14 50 h30"/>
    </g>
    <path d="M58 16 l6 6 l10 -12" stroke="#1BA64B" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- partículas de limpeza -->
  <g fill="#4FA8DC">
    <circle cx="620" cy="150" r="4" opacity=".5"/>
    <circle cx="660" cy="120" r="3" opacity=".4"/>
    <circle cx="700" cy="180" r="5" opacity=".35"/>
    <circle cx="580" cy="110" r="3" opacity=".45"/>
  </g>
</svg>
