<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" fill="none">
  <!--
    Blueprint técnico da unidade MaxFrio Arctic.
    Todos os traços principais usam pathLength="1" para permitir
    draw-in animado via stroke-dashoffset no GSAP.
  -->
  <g stroke="#33506B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

    <!-- contorno da unidade -->
    <path class="bp-main" pathLength="1" d="M140 96 H980 Q1016 96 1016 132 V388 Q1016 424 980 424 H140 Q104 424 104 388 V132 Q104 96 140 96 Z" stroke="#2A4B68" stroke-width="3"/>

    <!-- linha da tampa -->
    <path class="bp-main" pathLength="1" d="M104 352 H1016" stroke-dasharray="1 .012"/>

    <!-- grade superior -->
    <path class="bp-grid" pathLength="1" d="M150 128 H970" stroke-dasharray=".008 .016" stroke-opacity=".7"/>
    <path class="bp-grid" pathLength="1" d="M150 152 H970" stroke-dasharray=".008 .016" stroke-opacity=".7"/>
    <path class="bp-grid" pathLength="1" d="M150 176 H970" stroke-dasharray=".008 .016" stroke-opacity=".7"/>

    <!-- serpentina do evaporador -->
    <path class="bp-main" pathLength="1" d="M170 220 L170 320 M230 220 L230 320 M290 220 L290 320 M350 220 L350 320 M410 220 L410 320 M470 220 L470 320 M530 220 L530 320" stroke-opacity=".8"/>
    <path class="bp-main" pathLength="1" d="M170 230 H530 M170 268 H530 M170 306 H530" stroke-opacity=".45"/>

    <!-- turbina -->
    <circle class="bp-main" pathLength="1" cx="760" cy="268" r="74" stroke-opacity=".9"/>
    <circle class="bp-grid" pathLength="1" cx="760" cy="268" r="50" stroke-dasharray=".006 .01" stroke-opacity=".55"/>
    <path class="bp-main" pathLength="1" d="M760 268 L760 200 M760 268 L818 302 M760 268 L702 302" stroke-opacity=".8"/>
    <circle class="bp-main" pathLength="1" cx="760" cy="268" r="8" stroke-opacity=".9"/>

    <!-- display -->
    <rect class="bp-main" pathLength="1" x="912" y="204" width="70" height="44" rx="8" stroke-opacity=".75"/>

    <!-- venezianas -->
    <path class="bp-grid" pathLength="1" d="M140 380 H980" stroke-dasharray=".004 .008" stroke-opacity=".8"/>
    <path class="bp-grid" pathLength="1" d="M140 398 H980" stroke-dasharray=".004 .008" stroke-opacity=".6"/>

    <!-- fluxo de ar -->
    <path class="bp-flow" pathLength="1" d="M240 424 C260 470 320 500 420 512" stroke="#4FA8DC" stroke-width="2.5" stroke-dasharray=".05 .03"/>
    <path class="bp-flow" pathLength="1" d="M480 424 C500 478 560 510 660 522" stroke="#4FA8DC" stroke-width="2.5" stroke-dasharray=".05 .03"/>
    <path class="bp-flow" pathLength="1" d="M720 424 C740 470 800 498 900 510" stroke="#4FA8DC" stroke-width="2.5" stroke-dasharray=".05 .03"/>
    <path class="bp-arrow" pathLength="1" d="M420 512 l-26 -6 M420 512 l-4 -26" stroke="#4FA8DC" stroke-width="2.5"/>
    <path class="bp-arrow" pathLength="1" d="M660 522 l-26 -6 M660 522 l-4 -26" stroke="#4FA8DC" stroke-width="2.5"/>
    <path class="bp-arrow" pathLength="1" d="M900 510 l-26 -6 M900 510 l-4 -26" stroke="#4FA8DC" stroke-width="2.5"/>

    <!-- linha de refrigeração até condensadora -->
    <path class="bp-main" pathLength="1" d="M1016 340 H1074 V560 H960" stroke-opacity=".8"/>
    <rect class="bp-main" pathLength="1" x="860" y="548" width="100" height="64" rx="8" stroke-opacity=".8"/>
    <path class="bp-grid" pathLength="1" d="M874 596 H946" stroke-dasharray=".008 .012" stroke-opacity=".6"/>

    <!-- cotas -->
    <path class="bp-dim" pathLength="1" d="M104 60 H1016" stroke-opacity=".65"/>
    <path class="bp-dim" pathLength="1" d="M104 52 V68 M1016 52 V68" stroke-opacity=".65"/>
    <path class="bp-dim" pathLength="1" d="M1076 132 V388" stroke-opacity=".0"/>
    <path class="bp-dim" pathLength="1" d="M1148 96 V424" stroke-opacity=".65"/>
    <path class="bp-dim" pathLength="1" d="M1140 96 H1156 M1140 424 H1156" stroke-opacity=".65"/>
    <path class="bp-dim" pathLength="1" d="M64 96 V424" stroke-opacity=".65"/>
    <path class="bp-dim" pathLength="1" d="M56 96 H72 M56 424 H72" stroke-opacity=".65"/>
  </g>

  <!-- rótulos -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="2.5" fill="#33506B">
    <text x="560" y="46" text-anchor="middle" font-weight="700">912 mm</text>
    <text x="1160" y="266" text-anchor="middle" transform="rotate(90 1160 266)" font-weight="700">320 mm</text>
    <text x="38" y="266" text-anchor="middle" transform="rotate(-90 38 266)" font-weight="700">282</text>
    <text x="560" y="590" text-anchor="middle" opacity=".8" letter-spacing="4">UNIDADE INTERNA | ARTIC 24 · ESCALA 1:10</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2" fill="#4FA8DC">
    <text x="180" y="552">FLUXO 8,4 m³/min</text>
  </g>
</svg>
