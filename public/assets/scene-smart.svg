<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10233A"/>
      <stop offset="1" stop-color="#0C1826"/>
    </linearGradient>
    <linearGradient id="sphone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B4266"/>
      <stop offset="1" stop-color="#12324E"/>
    </linearGradient>
    <filter id="sg" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <filter id="sglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#sw)"/>
  <!-- lua e janela -->
  <circle cx="676" cy="96" r="30" fill="#A8DDF9" opacity=".9"/>
  <circle cx="686" cy="88" r="26" fill="#10233A"/>
  <g stroke="#2A5B85" stroke-width="6">
    <rect x="560" y="60" width="180" height="150" rx="10"/>
    <path d="M650 60 v150 M560 135 h180"/>
  </g>
  <!-- estrelas -->
  <g fill="#A8DDF9">
    <circle cx="80" cy="80" r="2.5" opacity=".8"/>
    <circle cx="180" cy="60" r="2" opacity=".6"/>
    <circle cx="500" cy="90" r="2" opacity=".5"/>
    <circle cx="420" cy="50" r="2.5" opacity=".7"/>
    <circle cx="260" cy="110" r="1.8" opacity=".5"/>
  </g>

  <!-- unidade na parede -->
  <g filter="url(#sg)">
    <rect x="80" y="120" width="260" height="80" rx="20" fill="#F2FAFE"/>
    <path d="M98 174 h224" stroke="#9CC4DC" stroke-width="5" stroke-linecap="round"/>
    <circle cx="316" cy="138" r="4" fill="#7FE3FF"/>
    <text x="120" y="146" font-family="Arial" font-size="15" letter-spacing="2" fill="#33506B">ARTIC 24</text>
  </g>
  <path d="M120 200 q10 16 28 18 M200 200 q8 12 20 14 M280 200 q6 10 16 12" stroke="#7FE3FF" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 9" opacity=".8"/>

  <!-- ondas wi-fi -->
  <g stroke="#7FE3FF" stroke-width="5" fill="none" stroke-linecap="round" filter="url(#sglow)">
    <path d="M360 210 a70 70 0 0 1 60 -34" opacity=".9"/>
    <path d="M376 240 a100 100 0 0 1 84 -48" opacity=".65"/>
    <path d="M392 270 a130 130 0 0 1 108 -62" opacity=".4"/>
    <circle cx="352" cy="240" r="8" fill="#7FE3FF" stroke="none"/>
  </g>

  <!-- mão com celular -->
  <g filter="url(#sg)">
    <!-- celular -->
    <rect x="470" y="250" width="170" height="330" rx="30" fill="url(#sphone)" stroke="#4FA8DC" stroke-width="3"/>
    <rect x="486" y="266" width="138" height="298" rx="20" fill="#0C1826"/>
    <!-- UI -->
    <text x="555" y="360" text-anchor="middle" font-family="Arial" font-size="64" font-weight="700" fill="#7FE3FF">22°</text>
    <text x="555" y="392" text-anchor="middle" font-family="Arial" font-size="14" letter-spacing="3" fill="#5B8AA9">MODO SONO</text>
    <g stroke="#2A5B85" stroke-width="3">
      <path d="M506 430 h98 M506 458 h98 M506 486 h98"/>
    </g>
    <circle cx="506" cy="430" r="8" fill="#4FA8DC"/>
    <circle cx="506" cy="458" r="8" fill="#4FA8DC" opacity=".5"/>
    <circle cx="506" cy="486" r="8" fill="#4FA8DC" opacity=".25"/>
    <rect x="530" y="520" width="50" height="10" rx="5" fill="#2A5B85"/>
    <!-- polegar -->
    <path d="M640 480 Q700 470 706 420 Q708 396 690 396 Q672 398 664 430 L656 470 Z" fill="#E8C9A8"/>
    <path d="M470 440 Q420 448 414 500 Q410 540 440 548 L470 540 Z" fill="#E8C9A8"/>
    <!-- pulso -->
    <path d="M470 540 Q460 580 500 588 L640 588 Q690 580 676 500" fill="#2A5B85"/>
  </g>

  <!-- zzz -->
  <g fill="#5B8AA9" font-family="Arial" font-weight="700">
    <text x="660" y="300" font-size="26" opacity=".8">z</text>
    <text x="680" y="270" font-size="32" opacity=".6">z</text>
    <text x="704" y="236" font-size="40" opacity=".4">z</text>
  </g>
</svg>
