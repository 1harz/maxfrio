<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 960" fill="none">
  <defs>
    <linearGradient id="pbody" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F1F9FD"/>
      <stop offset="1" stop-color="#C9E4F4"/>
    </linearGradient>
    <linearGradient id="plouver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB8D2"/>
      <stop offset=".5" stop-color="#BBDCEE"/>
      <stop offset="1" stop-color="#7FA9C6"/>
    </linearGradient>
    <filter id="pshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#0C1826" flood-opacity=".3"/>
    </filter>
    <clipPath id="pclip">
      <rect x="80" y="80" width="400" height="800" rx="42"/>
    </clipPath>
  </defs>

  <g filter="url(#pshadow)">
    <rect x="80" y="80" width="400" height="800" rx="42" fill="url(#pbody)"/>
    <g clip-path="url(#pclip)">
      <path d="M80 150 L480 90 V130 L80 190 Z" fill="#FFFFFF" opacity=".7"/>
      <path d="M480 300 L80 360 V330 L480 270 Z" fill="#FFFFFF" opacity=".18"/>
      <!-- display -->
      <rect x="272" y="150" width="168" height="58" rx="12" fill="#0F2438" opacity=".88"/>
      <text x="356" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#7FE3FF">22°</text>
      <!-- grade superior -->
      <g stroke="#B9D9EC" stroke-width="3" stroke-linecap="round">
        <path d="M116 128h328" stroke-dasharray="2 20"/>
      </g>
      <!-- venezianas verticais frontais -->
      <rect x="80" y="268" width="400" height="500" fill="#DCEFFA"/>
      <g stroke="url(#plouver)" stroke-width="7" stroke-linecap="round">
        <path d="M112 292v452"/>
        <path d="M148 292v452"/>
        <path d="M184 292v452"/>
        <path d="M220 292v452"/>
        <path d="M256 292v452"/>
        <path d="M292 292v452"/>
        <path d="M328 292v452"/>
        <path d="M364 292v452"/>
        <path d="M400 292v452"/>
        <path d="M436 292v452"/>
      </g>
      <path d="M80 268h400v10H80z" fill="#FFFFFF" opacity=".55"/>
      <!-- base -->
      <rect x="80" y="790" width="400" height="90" fill="#CBE4F3"/>
      <path d="M120 830h320" stroke="#8FB8D2" stroke-width="6" stroke-linecap="round"/>
      <path d="M120 854h320" stroke="#8FB8D2" stroke-width="6" stroke-linecap="round" opacity=".7"/>
    </g>
    <rect x="80" y="80" width="400" height="800" rx="42" stroke="#A5CCE1" stroke-width="3"/>
    <path d="M80 268h400" stroke="#A9CFE3" stroke-width="3"/>
    <!-- floco de marca -->
    <g transform="translate(150,180)" stroke="#8FB8D2" stroke-width="3.2" stroke-linecap="round" opacity=".9">
      <path d="M0-16v32M-13.8-8l27.6 16M13.8-8l-27.6 16"/>
      <path d="M0-16l-4.5 4.5M0-16l4.5 4.5M0 16l-4.5-4.5M0 16l4.5-4.5"/>
    </g>
  </g>
  <ellipse cx="280" cy="930" rx="180" ry="20" fill="#0C1826" opacity=".12"/>
</svg>
