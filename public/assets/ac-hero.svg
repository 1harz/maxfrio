<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" fill="none">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".42" stop-color="#F3FAFE"/>
      <stop offset=".78" stop-color="#DDEFF9"/>
      <stop offset="1" stop-color="#C4E3F4"/>
    </linearGradient>
    <linearGradient id="edgeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9CC8E0" stop-opacity=".9"/>
      <stop offset=".08" stop-color="#CFE8F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="edgeR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#9CC8E0" stop-opacity=".9"/>
      <stop offset=".08" stop-color="#CFE8F5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topGloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="louver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FB8D2"/>
      <stop offset=".5" stop-color="#BBDCEE"/>
      <stop offset="1" stop-color="#7FA9C6"/>
    </linearGradient>
    <radialGradient id="ledGlow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#7FE3FF" stop-opacity=".9"/>
      <stop offset=".45" stop-color="#4FC7EF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#4FC7EF" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="26" stdDeviation="24" flood-color="#0C1826" flood-opacity=".32"/>
    </filter>
    <clipPath id="bodyClip">
      <rect x="60" y="110" width="1080" height="310" rx="44"/>
    </clipPath>
  </defs>

  <!-- corpo principal -->
  <rect x="60" y="110" width="1080" height="310" rx="44" fill="url(#body)" filter="url(#softShadow)"/>

  <g clip-path="url(#bodyClip)">
    <!-- sombreado das laterais -->
    <rect x="60" y="110" width="1080" height="310" fill="url(#edgeL)"/>
    <rect x="60" y="110" width="1080" height="310" fill="url(#edgeR)"/>
    <!-- brilho superior -->
    <path d="M60 154 Q600 96 1140 154 V128 Q600 74 60 128 Z" fill="url(#topGloss)" opacity=".8"/>
    <!-- reflexo diagonal do gloss -->
    <path d="M180 110 L420 110 L240 420 L60 420 Z" fill="#FFFFFF" opacity=".14"/>
    <path d="M260 110 L320 110 L160 420 L100 420 Z" fill="#FFFFFF" opacity=".10"/>

    <!-- faixa superior de entrada de ar -->
    <rect x="112" y="128" width="976" height="34" rx="17" fill="#E9F5FC"/>
    <g stroke="#B9D9EC" stroke-width="3" stroke-linecap="round" opacity=".85">
      <path d="M140 145h920" stroke-dasharray="2 22"/>
    </g>

    <!-- display LED -->
    <circle cx="1052" cy="212" r="46" fill="url(#ledGlow)"/>
    <circle cx="1052" cy="212" r="7" fill="#31B6E4"/>
    <rect x="972" y="196" width="52" height="32" rx="8" fill="#0F2438" opacity=".85"/>
    <text x="998" y="219" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#7FE3FF" letter-spacing="1">22</text>

    <!-- pequeno floco de marca -->
    <g transform="translate(148,212)" stroke="#8FB8D2" stroke-width="3.4" stroke-linecap="round" opacity=".9">
      <path d="M0-16v32M-13.8-8l27.6 16M13.8-8l-27.6 16"/>
      <path d="M0-16l-4.5 4.5M0-16l4.5 4.5M0 16l-4.5-4.5M0 16l4.5-4.5"/>
      <path d="M-13.8-8l1.7 6M-13.8-8l6-1.7M13.8 8l-1.7-6M13.8 8l-6 1.7"/>
    </g>
    <g transform="translate(196,212)" stroke="#A9CCDF" stroke-width="2.6" stroke-linecap="round" opacity=".7">
      <path d="M0-12v24M-10.4-6l20.8 12M10.4-6l-20.8 12"/>
    </g>

    <!-- região central vazada (armazenamento do trocador) -->
    <rect x="92" y="262" width="1016" height="10" rx="5" fill="#CBE4F3" opacity=".6"/>

    <!-- saída de ar inferior: venezianas -->
    <rect x="60" y="336" width="1080" height="84" fill="#DCEFFA"/>
    <g clip-path="url(#bodyClip)">
      <g stroke="url(#louver)" stroke-width="7" stroke-linecap="round">
        <path d="M84 352h1032"/>
        <path d="M84 370h1032"/>
        <path d="M84 388h1032"/>
        <path d="M84 406h1032"/>
      </g>
      <path d="M60 336h1080v10H60z" fill="#FFFFFF" opacity=".55"/>
    </g>
  </g>

  <!-- contorno -->
  <rect x="60" y="110" width="1080" height="310" rx="44" stroke="#A5CCE1" stroke-width="2.5"/>
  <!-- linha da tampa -->
  <path d="M104 336h992" stroke="#A9CFE3" stroke-width="2.5"/>

  <!-- sombra no chão -->
  <ellipse cx="600" cy="486" rx="430" ry="26" fill="#0C1826" opacity=".14"/>
</svg>
