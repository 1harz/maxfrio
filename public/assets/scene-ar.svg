<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <linearGradient id="aw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FAFE"/>
      <stop offset="1" stop-color="#DCEEF9"/>
    </linearGradient>
    <linearGradient id="aflow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE3FF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7FE3FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="ag" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#16304F" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="800" height="600" fill="url(#aw)"/>
  <path d="M0 486 H800 V600 H0 Z" fill="#CFE6F3"/>
  <path d="M0 486 H800" stroke="#9CC4DC" stroke-width="3"/>
  <path d="M60 486 V96 H740 V486" stroke="#A9CDE2" stroke-width="3" fill="#FFFFFF" opacity=".5"/>

  <!-- cortinas de ar -->
  <path d="M240 190 C250 300 290 380 350 470 L410 470 C350 380 310 300 300 190 Z" fill="url(#aflow)"/>
  <path d="M420 190 C430 310 470 390 540 480 L590 480 C520 390 480 310 470 190 Z" fill="url(#aflow)" opacity=".7"/>

  <!-- unidade no alto -->
  <g filter="url(#ag)">
    <rect x="280" y="120" width="240" height="72" rx="18" fill="#FFFFFF" stroke="#8FB8D2" stroke-width="2.5"/>
    <path d="M294 166 h212" stroke="#9CC4DC" stroke-width="5" stroke-linecap="round"/>
    <circle cx="500" cy="136" r="4" fill="#31B6E4"/>
  </g>

  <!-- partículas puras -->
  <g fill="#4FA8DC">
    <circle cx="320" cy="260" r="5" opacity=".6"/>
    <circle cx="360" cy="330" r="4" opacity=".5"/>
    <circle cx="300" cy="400" r="6" opacity=".4"/>
    <circle cx="430" cy="280" r="4" opacity=".55"/>
    <circle cx="470" cy="360" r="5" opacity=".45"/>
    <circle cx="520" cy="300" r="3" opacity=".5"/>
    <circle cx="400" cy="430" r="4" opacity=".4"/>
    <circle cx="530" cy="420" r="5" opacity=".35"/>
  </g>
  <!-- flocos pequenos -->
  <g stroke="#4FA8DC" stroke-width="2" stroke-linecap="round" opacity=".65">
    <g transform="translate(350,240)"><path d="M0-9v18M-7.8-4.5l15.6 9M7.8-4.5l-15.6 9"/></g>
    <g transform="translate(480,330)"><path d="M0-9v18M-7.8-4.5l15.6 9M7.8-4.5l-15.6 9"/></g>
    <g transform="translate(300,350) scale(.8)"><path d="M0-9v18M-7.8-4.5l15.6 9M7.8-4.5l-15.6 9"/></g>
  </g>

  <!-- planta -->
  <g transform="translate(640,380)">
    <path d="M0 106 V60 M0 76 C-26 70 -40 48 -38 26 C-16 30 -2 48 0 76 C22 68 38 46 36 22 C14 26 2 48 0 76 M0 52 C-16 40 -22 20 -18 2 C-2 10 4 32 0 52 M0 52 C16 40 22 20 18 2 C2 10 -4 32 0 52" stroke="#2E8B57" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M-34 106 h68 l-8 34 h-52 Z" fill="#16304F"/>
    <path d="M-34 118 h68" stroke="#4FA8DC" stroke-width="5"/>
  </g>

  <!-- pessoa respirando aliviada -->
  <g transform="translate(150,340)">
    <path d="M30 146 L34 92 Q52 74 70 92 L74 146 Z" fill="#2A5B85"/>
    <circle cx="52" cy="58" r="20" fill="#E8C9A8"/>
    <path d="M32 54 a20 20 0 0 1 40 0 v-6 a20 15 0 0 0 -40 0 Z" fill="#16304F"/>
    <path d="M40 118 q12 10 24 0" stroke="#7FE3FF" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- camadas do filtro -->
  <g transform="translate(560,120)">
    <rect x="0" y="0" width="120" height="14" rx="7" fill="#8FB8D2"/>
    <rect x="10" y="24" width="120" height="14" rx="7" fill="#4FA8DC" opacity=".8"/>
    <rect x="20" y="48" width="120" height="14" rx="7" fill="#4FA8DC" opacity=".5"/>
    <text x="60" y="92" font-family="Arial" font-size="14" letter-spacing="2" fill="#33506B" text-anchor="middle">HEPA H13</text>
  </g>
</svg>
